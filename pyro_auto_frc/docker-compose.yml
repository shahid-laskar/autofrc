services:

  frc-recharge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frc_recharge_service
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8010:8000"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - frc_net

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
     
      start_period: 45s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


networks:
  frc_net:
    driver: bridge