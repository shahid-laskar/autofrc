services:

  frc-recharge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frc_recharge_service
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000" 

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - pyro_shared_net

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
     
      start_period: 45s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile    
    container_name: frc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro      
    depends_on:
      frc-recharge:
        condition: service_healthy
    networks:
      - pyro_shared_net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  pyro_shared_net:
    external: true