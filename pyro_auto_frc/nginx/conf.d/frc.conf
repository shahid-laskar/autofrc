server {
    listen 80;
    server_name smpyrogateway.bsnl.co.in;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl ;
    http2 on;
    server_name smpyrogateway.bsnl.co.in;

    ssl_certificate     /etc/nginx/ssl/smpyrogateway.bsnl.co.in.crt;
    ssl_certificate_key /etc/nginx/ssl/smpyrogateway.bsnl.co.in.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/smpyro_access.log;
    error_log   /var/log/nginx/smpyro_error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"          always;
    add_header X-XSS-Protection        "1; mode=block" always;

    # ── Callback POST body limit (Pyro sends JSON payloads) ───────────────────
    client_max_body_size 1m;

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        set $api_upstream http://frc-recharge:8000;

        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $api_upstream;

        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /api;

        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffer_size        16k;
        proxy_buffers            4 16k;
        proxy_busy_buffers_size  32k;
    }

    location /pyro-inventory/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream http://pyro_inventory:8002;
        rewrite ^/pyro-inventory/(.*)$ /$1 break;
        proxy_pass $upstream;        

        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /pyro-inventory;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffer_size        16k;
        proxy_buffers            4 16k;
        proxy_busy_buffers_size  32k;
       
    }


    # ── Block all other paths ─────────────────────────────────────────────────
    location / {
        return 404;
    }
}