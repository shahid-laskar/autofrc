services:

  frc-recharge:
    image: frc_recharge:v2
    container_name: frc_recharge
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - pyro_shared_net

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: frc_nginx:v2
    container_name: frc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frc-recharge:
        condition: service_healthy
    networks:
      - pyro_shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  pyro_shared_net:
    external: true