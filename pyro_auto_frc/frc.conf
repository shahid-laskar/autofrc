# nginx/conf.d/frc.conf
#
# Drop this file into /etc/nginx/conf.d/ on the host if you are running
# nginx natively, OR it is auto-mounted by docker-compose into the nginx
# container at /etc/nginx/conf.d/frc.conf.
#
# Assumption: mitra.bsnl.co.in SSL cert and key are at:
#   ./nginx/ssl/mitra.bsnl.co.in.crt
#   ./nginx/ssl/mitra.bsnl.co.in.key
#
# If mitra.bsnl.co.in already has an nginx/apache server block elsewhere,
# ONLY add the `location /smpyro/` block from the server{} section below
# into your existing server block — do not duplicate the server{} wrapper.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name mitra.bsnl.co.in;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name mitra.bsnl.co.in;

    ssl_certificate     /etc/nginx/ssl/smpyrogateway.bsnl.co.in.crt;
    ssl_certificate_key /etc/nginx/ssl/smpyrogateway.bsnl.co.in.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── /smpyro/ → FRC Recharge FastAPI service ──────────────────────────────
    location /smpyro/ {

        proxy_pass http://frc-recharge:8000/;

        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   X-Forwarded-Prefix /frc;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffer_size        16k;
        proxy_buffers            4 16k;
        proxy_busy_buffers_size  32k;
    }

    # ── (your other app locations go here) ───────────────────────────────────
    # location /otherapp/ { ... }
}